#
# Apache reverse proxy for the notify_push daemon (realtime push).
#
# Bind-mounted read-only into /etc/apache2/conf-enabled/ by docker-compose.yml.
# It lives in a FILE under version control rather than being written by
# setup.sh with `docker exec`, because /etc/apache2 is part of the container's
# ephemeral layer: any `docker compose up -d` that recreates kanso-dev (a
# compose edit, an NC_VERSION bump, a KANSO_APP_SRC re-point from another
# worktree) threw the exec'd config away. The daemon stayed up and Nextcloud
# kept advertising the push capability (notify_push:setup persists
# base_endpoint in the database), so every client went on dialling
# ws://localhost:8891/push/ws and got a plain Nextcloud 404 — which shows up as
# a console error and reddens every e2e spec that asserts a clean console.
# Mounted, the proxy is part of the container's definition and comes back with
# it. Do NOT move this back into a `docker exec` in setup.sh.
#
# LoadModule instead of `a2enmod`, for the same reason: mods-enabled/ is in the
# container layer too. apache2.conf includes mods-enabled/*.load first and
# conf-enabled/*.conf later, so loading them here is late but still server
# config — and it keeps the whole proxy self-contained in one mounted file.
# <IfModule !…> so this is a no-op if a future image ships them enabled.
<IfModule !proxy_module>
	LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
	LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
</IfModule>
<IfModule !proxy_wstunnel_module>
	LoadModule proxy_wstunnel_module /usr/lib/apache2/modules/mod_proxy_wstunnel.so
</IfModule>

# Apache already answers on :80 (published to the host as :8891). Listening on
# :8891 inside the container as well makes ONE url — http://localhost:8891/push
# — work from the browser and from occ/php, which is what `occ notify_push:setup`
# is handed and what it then hands back to clients as base_endpoint.
Listen 8891

# Server level, not inside a vhost, so both ports get it. mod_proxy runs at
# translate-name, ahead of Nextcloud's per-directory .htaccess rewrites.
#
# `notify_push` only resolves under the postgres compose profile (that is the
# only profile the daemon runs in). Measured with the daemon stopped: mod_proxy
# resolves the backend per REQUEST, not at config time, so Apache starts
# normally and Nextcloud serves as usual (status.php 200); only /push/* answers
# 500 with one `AH00898: DNS lookup failure for: notify_push` in the error log.
# That is the honest answer for a stack with no push daemon, and it is why the
# sqlite/mysql install-matrix legs are unaffected by this mount. Do not "fix"
# the log line by hard-coding an IP.
ProxyPass /push/ws ws://notify_push:7867/ws
ProxyPass /push/ http://notify_push:7867/
ProxyPassReverse /push/ http://notify_push:7867/
