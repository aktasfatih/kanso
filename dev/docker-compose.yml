#
# Throwaway development Nextcloud with this app mounted from the checkout.
# Defaults to nextcloud:34-apache / PHP 8.3 + postgres 16 — deliberately one
# below the supported ceiling, because the e2e suite is pinned to NC 34 and
# boots this same stack. The app supports NC 32–35; pass NC_VERSION to boot
# another (the install matrix boots all four).
#
#   cd dev && ./setup.sh          # start + enable the app
#   http://localhost:8891         # login: admin / admin
#
# Restart vs. reset — they are DIFFERENT commands, and picking the wrong one
# used to brick the stack:
#
#   docker compose down && ./setup.sh                    # restart: install + data survive
#   docker compose --profile '*' down -v && ./setup.sh   # reset: destroys everything
#
# The `--profile '*'` on the reset is not decoration. `-v` only removes the
# volumes of services in ACTIVE profiles, so a bare `docker compose down -v`
# deletes the webroot while leaving the (profiled) database container running
# with all its data — which is the exact half-wiped state that bricks the next
# boot. The wildcard selects every profile, so one command clears whichever
# driver was last used. Verified on compose v5.1.1; `--remove-orphans` does NOT
# do this. See the `volumes:` block at the bottom of this file.
#
# Neither command re-runs Kanso's migrations: setup.sh only re-enables the app,
# and Nextcloud runs an app's migrations only when info.xml's <version> is newer
# than the installed one (feature branches never bump it — see CLAUDE.md). So
# after ADDING a migration, reset rather than restart, or you get new PHP code
# against the previous schema. `./smoke.sh` says so out loud when that happens.
#
# Cross-version / cross-DB matrix (used by CI, works locally too):
#   NC_VERSION=32 KANSO_DB=postgres ./setup.sh   # NC 32 on postgres
#   NC_VERSION=32 KANSO_DB=sqlite   ./setup.sh   # NC 32 on sqlite (no db service)
#   NC_VERSION=34 KANSO_DB=mysql    ./setup.sh   # NC 34 on mariadb
#
# NC_VERSION selects the nextcloud:<tag>-apache image (default 34).
# KANSO_DB selects the database driver via a compose profile (default postgres):
#   - postgres → postgres:16 service
#   - mysql    → mariadb:11 service (Nextcloud's MySQL-compatible target)
#   - sqlite   → no db service at all; the NC image installs SQLite in-container
# The db-specific env for the nextcloud service is layered by setup.sh through
# an env file it generates (dev/.db.env), so the Nextcloud auto-installer picks
# the right driver. Only the selected DB profile's service is started.
#
# Explicit project name: without it compose uses the directory name ("dev"),
# which collides with any sibling app's dev/ stack.
name: kanso-dev
services:
  db:
    image: postgres:16
    container_name: kanso-dev-db
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    # So the nextcloud service can wait for the DB to actually accept
    # connections before it starts installing (avoids a first-boot race).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - db_postgres:/var/lib/postgresql/data

  # MariaDB is Nextcloud's MySQL-compatible target. Same logical hostname alias
  # ("db") as postgres so the nextcloud service's *_HOST wiring is uniform; only
  # one db profile is ever active at a time so there's no name clash.
  db-mysql:
    image: mariadb:11
    container_name: kanso-dev-db
    profiles: ["mysql"]
    # Nextcloud wants READ-COMMITTED isolation on MariaDB. Binary-logging /
    # row-format are production replication settings, not needed to verify
    # install + migrations, so they are omitted here.
    #
    # Everything after the isolation level exists to shrink FIRST BOOT, which is
    # the only boot that can fail. The rest of this comment is why, and what the
    # numbers actually are, because the obvious candidates are mostly duds.
    #
    # THE FAILURE. On a saturated CI runner this container exits 1 during its
    # first boot, and the symptom everyone reads is three layers downstream:
    #
    #   Container kanso-dev-db  Skipped: optional dependency "db-mysql" failed to start
    #   getaddrinfo for db failed: No address associated with hostname
    #   Installing of nextcloud failed!
    #
    # The real line is the image's own entrypoint giving up.
    # /usr/local/bin/docker-entrypoint.sh in mariadb:11, docker_temp_server_start():
    #
    #   for i in {30..0}; do
    #     if docker_process_sql ... <<<'SELECT 1' &> /dev/null; then break; fi
    #     sleep 1
    #   done
    #   if [ "$i" = 0 ]; then mysql_error "Unable to start server."; fi
    #
    # First boot runs mariadb-install-db, then starts a TEMPORARY server to
    # create the database and user, and gives it 31 one-second probes to answer.
    # That budget is a literal: every MARIADB_*/MYSQL_* variable the entrypoint
    # reads was enumerated and none extends it. The only way to stay inside it is
    # to reach "ready" sooner.
    #
    # WHICH RESOURCE BINDS. The two phases are bound by DIFFERENT resources, and
    # that is the whole reason earlier guesses missed. Measured by booting this
    # image on a cold volume under one constraint at a time (cgroup cpu quota vs.
    # blkio io.max on the datadir device):
    #
    #                                 idle   50 IOPS   0.10 CPU     0.04 CPU
    #   mariadb-install-db             4s      39s        5s           7s
    #   temp server -> answers SELECT  1s       5s       10s      FAILS, 3 of 5
    #
    # So install-db is I/O-bound — and specifically bound by the NUMBER of file
    # creations and fsyncs for the ~90 files of the `mysql` schema, not by bytes
    # (see the innodb-log-file-size dud below) — while the phase that actually
    # blows the budget is CPU-bound: on an idle host it burns 1.0-2.4s of CPU in
    # 1.0-2.4s of wall time, i.e. wall == CPU, no waiting. 31s / ~1.5s means the
    # temp server fails as soon as it is handed less than ~5% of one core.
    #
    # The failing run (run 36606682765, `install (NC 35 - mariadb)`) shows both
    # scarcities at once: install-db took 40s — exactly the 50-IOPS column — and
    # then the temp server missed 31 probes. Its sibling steps agree: the image
    # pre-pull took 422s against 97s on a healthy leg (4.3x, I/O), while
    # `npm run build`, pure CPU, took 56s against 34s (1.6x). The node was
    # I/O-saturated and CPU-contended.
    #
    # WHAT THESE OPTIONS BUY, and what they do NOT. They are all mariadbd
    # options, and all of them are safe here for one reason: this database is
    # THROWAWAY. It is created empty on every boot and exists only to prove that
    # Kanso's migrations apply on MariaDB. There is no data to lose, so the
    # buffers are cut to what a migration test needs and durability is turned off
    # outright. Numbers, at 50 IOPS — the column that matches the failing run,
    # 5 cold boots per arm and the two arms do not overlap:
    #
    #                    total first boot   install-db   temp server
    #   default              55.5-57.2s      39-40s        4-6s
    #   with these            46.1-47.7s      36-37s        1-2s
    #
    # Off the I/O constraint the picture is much weaker. The temp-server phase's
    # own CPU cost, measured 6 times per arm on an idle host, is a median 1285ms
    # by default and 800ms with these options — but the spread is 410-2200ms and
    # 320-1420ms, so what this really buys is a shorter TAIL, not a reliably
    # shorter phase. And at the cliff itself (a 0.04-core quota, which reproduces
    # the CI failure exactly: same silent stall, same entrypoint error) a
    # work-reduced arm did NOT pass more often than the control — 2 of 5 either
    # way, over 10 cold boots. That arm was a superset of this one, including the
    # two options listed as dropped below; the point stands regardless, because
    # nothing here is anywhere near a 20x saving.
    #
    # So this is a real but partial mitigation, and it is honest about that: the
    # runner stretched a ~1.3s phase past 31s, i.e. by more than 20x, and no
    # option here removes 20x of work. dev/setup.sh therefore carries the second
    # layer, which is what actually makes the leg deterministic: it detects
    # exactly this first-boot failure, REMOVES THE DATABASE VOLUME, and boots
    # once more. See the comment there for why the wipe is mandatory.
    #
    # MEASURED AND RULED OUT, so nobody re-adds them as "the fix":
    #   * cpu_shares: 10240 — was here until this commit, and could never have
    #     worked. cpu.weight is RELATIVE, and only among siblings under the same
    #     cgroup parent. CI runs this stack inside a dind daemon in an ARC
    #     runner pod; in that daemon this container's only siblings are an idle
    #     redis and the nextcloud container, which compose has not started yet
    #     (it is parked on the depends_on below). There is nobody to take CPU
    #     from. The contention is at the Kubernetes NODE level, above the pod's
    #     cgroup, where a child's weight has no reach. It "passed" a local
    #     harness that pinned 40 busy CONTAINERS next to this one — in-daemon
    #     siblings, where weights do bite — which is precisely the wrong model,
    #     and it then failed in CI on the commit that added it.
    #   * --innodb-log-file-size. The most plausible-looking option here and a
    #     complete dud. ib_logfile0 is 96MiB of the 143MB install-db writes, and
    #     it really is fully allocated on disk — but by posix_fallocate, so it
    #     costs extents, not writes. At 32M the whole boot's datadir drops
    #     162MB -> 98MB and at 8M to 74MB, and install-db still takes 40s at 50
    #     IOPS in every case. Omitted on purpose: it saves disk, not time.
    #   * --key-buffer-size=8M and --innodb-temp-data-file-path=ibtmp1:1M. Both
    #     look like the same kind of saving and neither survived replication:
    #     over 6 runs each their medians land inside the control's spread, and
    #     adding the ibtmp1 shrink to the set above made the median WORSE
    #     (1515ms vs 800ms) while growing the datadir, because the 12MiB file it
    #     avoids writing once gets autoextended later instead. Dropped.
    #   * --innodb-use-native-aio=0. The io_uring EPERM in the log is Docker's
    #     seccomp profile, not a broken host, and MariaDB falls back to libaio
    #     successfully. Forcing the aio path off did not help.
    #   * MARIADB_INITDB_SKIP_TZINFO=1. Cannot help: docker_setup_db() loads the
    #     timezone tables AFTER the wait that fails.
    #   * A bigger healthcheck start_period. Cannot help: the container exits on
    #     its own, so there is no unhealthy container left for a longer grace
    #     period to wait on. The 30s below is still right for the second boot,
    #     which is why it stays.
    #   * restart: on-failure. Actively harmful, and it must stay forbidden. The
    #     entrypoint treats a datadir as initialised the moment $DATADIR/mysql
    #     exists — which mariadb-install-db creates BEFORE the wait that fails —
    #     so a plain restart skips setup entirely. Verified: the container comes
    #     back up *running* with no `nextcloud` database, no `nextcloud` user and
    #     an unset root password. That is the hazard setup.sh's retry handles by
    #     deleting the volume first.
    command: >-
      --transaction-isolation=READ-COMMITTED
      --innodb-buffer-pool-size=32M
      --innodb-buffer-pool-size-max=32M
      --aria-pagecache-buffer-size=8M
      --skip-innodb-doublewrite
      --innodb-flush-log-at-trx-commit=0
      --innodb-flush-method=nosync
    environment:
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: nextcloud
      MARIADB_ROOT_PASSWORD: nextcloud
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - db_mysql:/var/lib/mysql
    networks:
      default:
        aliases:
          - db

  redis:
    image: redis:7-alpine
    container_name: kanso-dev-redis

  # notify_push daemon for realtime push testing. Reaches Nextcloud and its
  # DB/Redis over the compose network; browsers reach it through the apache
  # reverse proxy at http://localhost:8891/push (see setup.sh). Only started
  # for postgres (its DATABASE_URL is postgres-specific and realtime push is
  # not exercised by the cross-version install matrix).
  notify_push:
    # Pinned deliberately, and it needs a MANUAL bump — in lockstep with
    # NOTIFY_PUSH_VERSION/NOTIFY_PUSH_URL in setup.sh, which side-loads the
    # Nextcloud-side notify_push *app* at this same version. The two halves are
    # one pin; never move one without the other.
    #
    # Why: setup.sh's boot check `occ notify_push:self-test` compares the
    # daemon's version against the app's and fails when the major.minor differ.
    # Leaving either side floating (untagged here means :latest — whatever
    # upstream tagged last, or a months-old cached layer compose never re-pulls)
    # eventually reddens that check on a stack where nothing is wrong, and a
    # boot warning that is usually wrong gets ignored on the day it is right.
    #
    # When the two DO drift, the warning is CORRECT: bump this tag and setup.sh's
    # NOTIFY_PUSH_VERSION together, then re-run ./setup.sh. Do NOT silence, skip
    # or filter the version check to quiet it — a major/minor skew is a real
    # protocol mismatch (upstream already tolerates patch drift), and muting it
    # is how the stack goes back to lying about push. See setup.sh for the app
    # half and for what the failure actually looks like on a boot.
    image: icewind1991/notify_push:1.4.0
    container_name: kanso-dev-push
    profiles: ["postgres"]
    environment:
      NEXTCLOUD_URL: http://nextcloud
      DATABASE_URL: postgres://nextcloud:nextcloud@db/nextcloud
      DATABASE_PREFIX: oc_
      REDIS_URL: redis://redis
    depends_on:
      - db
      - redis
      - nextcloud

  nextcloud:
    image: nextcloud:${NC_VERSION:-34}-apache
    container_name: kanso-dev
    ports:
      - "8891:80"
    # Base env is DB-agnostic. The DB-driver env (POSTGRES_*/MYSQL_*/SQLITE_*)
    # is layered in from dev/.db.env, generated by setup.sh from KANSO_DB. The
    # file is always present (setup.sh writes it before `up`); env_file entries
    # override nothing here since the keys don't overlap.
    env_file:
      - .db.env
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      REDIS_HOST: redis
    volumes:
      # The Nextcloud webroot: its code, config/config.php, data/ and the
      # side-loaded custom_apps (notify_push, deck, contacts). NAMED so that
      # `docker compose down` && `up` reattaches the SAME install — see the
      # `volumes:` block at the bottom of this file.
      - nextcloud_html:/var/www/html
      # The app tree Nextcloud runs. Defaults to this checkout, which is what
      # every local run and every other CI job wants. dev/upgrade-check.sh points
      # it at a staging directory instead so it can boot the last RELEASED
      # version, seed it, and then replace the tree in place with the branch's
      # build before running `occ upgrade` — the update path a real user takes.
      # Relative paths resolve against this file's directory (dev/).
      - ${KANSO_APP_SRC:-..}:/var/www/html/custom_apps/kanso
      # Ensure the bundled apps dir is writable at install time; older NC majors
      # (30/31) abort the first-boot install otherwise. Runs as root pre-install.
      - ./hooks/pre-installation:/docker-entrypoint-hooks.d/pre-installation:ro
      # The notify_push reverse proxy (/push/ws + /push/). MOUNTED, not written
      # by setup.sh at boot: /etc/apache2 lives in the container's ephemeral
      # layer, so anything exec'd into it vanished the next time this service was
      # recreated — leaving the daemon up, the push capability still advertised,
      # and /push/ws answering 404. See the file for the full story.
      - ./apache/notify_push.conf:/etc/apache2/conf-enabled/notify_push.conf:ro
      # opcache.revalidate_freq=0, so the apache workers never execute bytecode
      # compiled from a version of a file that is no longer on disk. The image
      # ships 60s, which is correct in production and wrong for a live bind
      # mount — see the file for the two ways it silently faked a result.
      # The `zz-` on the TARGET is load-bearing: conf.d is applied in
      # alphabetical order, so anything sorting before the image's own
      # opcache-recommended.ini would simply be overridden by it.
      - ./php/opcache-dev.ini:/usr/local/etc/php/conf.d/zz-opcache-dev.ini:ro
    depends_on:
      redis:
        condition: service_started
      # Wait for whichever DB profile is active to be *healthy* (accepting
      # connections), not merely started — the NC first-boot installer races the
      # DB otherwise. required:false so the sqlite profile (no db service) is
      # unaffected; only the active profile's db is waited on.
      db:
        condition: service_healthy
        required: false
      db-mysql:
        condition: service_healthy
        required: false

# Every bit of stack state lives in one of these, and they are NAMED on purpose.
#
# The nextcloud and postgres/mariadb images all declare their data directory as
# a Dockerfile `VOLUME`, so leaving them out of this file does not mean "no
# state" — it means an ANONYMOUS volume per container, and anonymous volumes
# have a lifecycle nothing reattaches to:
#
#   docker compose down        # container gone, its anonymous volume orphaned
#   docker compose up -d       # fresh container, BLANK anonymous volume
#
# For the webroot that was a booby trap. `down` (without `--profile`) does not
# touch the profiled `db` service, so postgres kept running with a fully
# populated database while the new nextcloud container came up with an empty
# /var/www/html. The entrypoint sees no config.php, concludes "not installed",
# and re-runs `maintenance:install` against that live database:
#
#   PDOException: SQLSTATE[42501]: Insufficient privilege: 7
#     ERROR: permission denied for table oc_migrations
#   Retrying install...
#   Installing of nextcloud failed!            (container Exited (1))
#
# — which reads like a database-permissions bug and is really a volume-lifecycle
# one. `down -v` was the only reliable recovery, i.e. the only way to restart the
# stack was to destroy the database too.
#
# Named, the webroot and the database data reattach together on the next `up`,
# so `down` is a restart. Nothing else in the tree depends on the old behaviour:
# dev/upgrade-check.sh already opens with an explicit `--profile <db> down -v`
# (it must install the released version onto a pristine database), and CI boots
# each job on a docker daemon that has never run this stack — which is why the
# parallel install-matrix legs can all claim host port 8891 and the container
# name `kanso-dev` without colliding.
#
# The reset is `--profile '*' down -v`, NOT a bare `down -v`, for the reason in
# the header: volume removal follows the active profiles. Two consequences worth
# knowing:
#   * `--profile postgres down -v` never removes `db_mysql` (and vice versa), so
#     a machine that has used both drivers keeps a stale data dir for the other
#     one until a wildcard reset.
#   * there is no service with `profiles: ["sqlite"]`, so a sqlite reset only
#     needs the profile-less services — but for sqlite the database IS the
#     webroot (data/nextcloud.db), so removing `nextcloud_html` is a full reset.
#
# The other cost of persistence is that a webroot installed against a DIFFERENT
# KANSO_DB or a different NC major also survives, and Nextcloud would happily
# boot it and report itself healthy while running something nobody asked for.
# dev/setup.sh asserts against both after the boot rather than letting it pass
# quietly.
volumes:
  nextcloud_html:
  db_postgres:
  db_mysql:
