# Throwaway development Nextcloud with this app mounted from the checkout.
# Defaults mirror the newest supported target (nextcloud:34-apache / PHP 8.3 +
# postgres 16). The app supports NC 32–34; CI e2e boots this same stack. No
# volumes are persisted: `docker compose down` resets everything.
#
#   cd dev && ./setup.sh          # start + enable the app
#   http://localhost:8891         # login: admin / admin
#
# Cross-version / cross-DB matrix (used by CI, works locally too):
#   NC_VERSION=32 KANSO_DB=postgres ./setup.sh   # NC 32 on postgres
#   NC_VERSION=32 KANSO_DB=sqlite   ./setup.sh   # NC 32 on sqlite (no db service)
#   NC_VERSION=34 KANSO_DB=mysql    ./setup.sh   # NC 34 on mariadb
#
# NC_VERSION selects the nextcloud:<tag>-apache image (default 34).
# KANSO_DB selects the database driver via a compose profile (default postgres):
#   - postgres → postgres:16 service
#   - mysql    → mariadb:11 service (Nextcloud's MySQL-compatible target)
#   - sqlite   → no db service at all; the NC image installs SQLite in-container
# The db-specific env for the nextcloud service is layered by setup.sh through
# an env file it generates (dev/.db.env), so the Nextcloud auto-installer picks
# the right driver. Only the selected DB profile's service is started.
#
# Explicit project name: without it compose uses the directory name ("dev"),
# which collides with any sibling app's dev/ stack.
name: kanso-dev
services:
  db:
    image: postgres:16
    container_name: kanso-dev-db
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    # So the nextcloud service can wait for the DB to actually accept
    # connections before it starts installing (avoids a first-boot race).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 3s
      timeout: 5s
      retries: 30

  # MariaDB is Nextcloud's MySQL-compatible target. Same logical hostname alias
  # ("db") as postgres so the nextcloud service's *_HOST wiring is uniform; only
  # one db profile is ever active at a time so there's no name clash.
  db-mysql:
    image: mariadb:11
    container_name: kanso-dev-db
    profiles: ["mysql"]
    # Nextcloud wants READ-COMMITTED isolation on MariaDB. Binary-logging /
    # row-format are production replication settings, not needed to verify
    # install + migrations, and their first-boot init occasionally exits the
    # container in CI, so they are omitted here.
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: nextcloud
      MARIADB_ROOT_PASSWORD: nextcloud
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      default:
        aliases:
          - db

  redis:
    image: redis:7-alpine
    container_name: kanso-dev-redis

  # notify_push daemon for realtime push testing. Reaches Nextcloud and its
  # DB/Redis over the compose network; browsers reach it through the apache
  # reverse proxy at http://localhost:8891/push (see setup.sh). Only started
  # for postgres (its DATABASE_URL is postgres-specific and realtime push is
  # not exercised by the cross-version install matrix).
  notify_push:
    image: icewind1991/notify_push
    container_name: kanso-dev-push
    profiles: ["postgres"]
    environment:
      NEXTCLOUD_URL: http://nextcloud
      DATABASE_URL: postgres://nextcloud:nextcloud@db/nextcloud
      DATABASE_PREFIX: oc_
      REDIS_URL: redis://redis
    depends_on:
      - db
      - redis
      - nextcloud

  nextcloud:
    image: nextcloud:${NC_VERSION:-34}-apache
    container_name: kanso-dev
    ports:
      - "8891:80"
    # Base env is DB-agnostic. The DB-driver env (POSTGRES_*/MYSQL_*/SQLITE_*)
    # is layered in from dev/.db.env, generated by setup.sh from KANSO_DB. The
    # file is always present (setup.sh writes it before `up`); env_file entries
    # override nothing here since the keys don't overlap.
    env_file:
      - .db.env
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      REDIS_HOST: redis
    volumes:
      - ..:/var/www/html/custom_apps/kanso
      # Ensure the bundled apps dir is writable at install time; older NC majors
      # (30/31) abort the first-boot install otherwise. Runs as root pre-install.
      - ./hooks/pre-installation:/docker-entrypoint-hooks.d/pre-installation:ro
    depends_on:
      redis:
        condition: service_started
      # Wait for whichever DB profile is active to be *healthy* (accepting
      # connections), not merely started — the NC first-boot installer races the
      # DB otherwise. required:false so the sqlite profile (no db service) is
      # unaffected; only the active profile's db is waited on.
      db:
        condition: service_healthy
        required: false
      db-mysql:
        condition: service_healthy
        required: false
