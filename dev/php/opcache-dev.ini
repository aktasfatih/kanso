;
; Make the dev stack re-read PHP files the moment they change on disk.
;
; The nextcloud:*-apache images ship /usr/local/etc/php/conf.d/opcache-recommended.ini
; with `opcache.revalidate_freq=60`. That is the right production setting and
; the wrong one for a stack whose entire point is that the app tree is a live
; bind mount: for up to a minute after any edit, the apache workers keep
; executing the bytecode they compiled from the PREVIOUS contents of the file.
;
; Two concrete ways that bit us:
;
;   * dev/upgrade-check.sh replaces the mounted app tree in place (step 5) and
;     then asserts the seeded data still reads back (step 7). The swap and the
;     assertion are seconds apart, so apache answered with the RELEASE's entity
;     classes against the schema the branch's migrations had just changed:
;       BadFunctionCallException: description is not a valid attribute
;     - a harness artefact that looks exactly like a broken migration. Any
;     migration adding a column to kanso_stacks/kanso_cards/kanso_boards would
;     have produced it.
;
;   * a local PHP edit followed by an immediate curl/e2e check verifies against
;     the OLD bytecode, so a check can come back green having executed none of
;     the change - the worst kind of passing test.
;
; `opcache.validate_timestamps` stays on (the image's default), so this is just
; "stat the file on every request" rather than "disable opcache": the cache
; still does its job, it simply never serves a file it knows is stale.
;
; Comments here are `;`, NOT `#`. PHP's ini parser rejects `#`, and a rejected
; ini is not partially applied - the whole file is dropped with a one-line
; "syntax error" that nothing in the boot surfaces, leaving revalidate_freq
; quietly at 60 and this file looking like it works. Check with
; `docker exec kanso-dev php --ini` (the file must appear in "Additional .ini
; files parsed") after touching it.
;
; Loaded from conf.d, where PHP applies files in alphabetical order - the `zz-`
; prefix on the container-side mount path in docker-compose.yml is what makes
; this land AFTER opcache-recommended.ini and actually win. Do not rename the
; mount target to something that sorts earlier.
;
; Dev/CI only. Nothing here ships in the app tarball; production installs get
; the image's own tuning.
opcache.revalidate_freq=0
