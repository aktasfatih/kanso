[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanso-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the Kanso Nextcloud kanban app"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Fatih AKTAS", email = "akfatih2@gmail.com" }]
keywords = ["mcp", "nextcloud", "kanban", "kanso"]
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
kanso-mcp = "kanso_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["kanso_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
