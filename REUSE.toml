version = 1

# Licensing info for files that can't carry an inline SPDX header
# (JSON has no comment syntax, lockfiles are generated, images and
# markers are binary/empty). Source files declare their own headers.

[[annotations]]
path = [
    "composer.json",
    "composer.lock",
    "package.json",
    "package-lock.json",
    "tests/psalm-baseline.xml",
    "tests/fixtures/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Fatih AKTAS <akfatih2@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
    ".gitignore",
    "README.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "CLA.md",
    "LICENSE",
    "tests/unit/.gitkeep",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Fatih AKTAS <akfatih2@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Fatih AKTAS <akfatih2@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Translations: the compiled l10n bundles (.js/.json, generated by
# scripts/l10n.mjs) and the gettext catalogs (.pot/.po). JSON can't carry an
# inline header and the bundles are generated, so cover the whole tree here.
[[annotations]]
path = ["l10n/**", "translationfiles/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Fatih AKTAS <akfatih2@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"
