#
# Dependabot keeps Kanso aware of new releases. Notably `nextcloud/ocp` tracks
# the Nextcloud major line, so an ocp-major PR is the signal that a new
# Nextcloud is out — raise appinfo/info.xml max-version and re-verify the app
# (see CONTRIBUTING.md, "Staying current with Nextcloud"). Minor/patch updates
# are grouped into one weekly PR per ecosystem — npm splits into two, because
# production and dev deps differ in whether they ship to users — and majors get
# their own PR so they get real review. Nothing auto-merges — every PR runs the
# full CI first.
version: 2
updates:
  # PHP / Nextcloud (nextcloud/ocp = NC-version radar) + dev tooling
  # (psalm, phpunit, coding-standard, sabre/vobject).
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      composer-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Frontend (Vue, @nextcloud/*, @tanstack/*, Vite, Playwright, …).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Production deps are bundled into js/ by Vite and ship inside the App Store
    # tarball, so a bump there is user-facing: `fix(deps)` lets semantic-release
    # cut a patch instead of leaving it parked until the next unrelated release.
    # devDependencies never reach users, so they stay `chore(deps)` (no release).
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      npm-production:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions pinned in the CI + release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
