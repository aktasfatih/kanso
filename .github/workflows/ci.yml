name: CI

on:
  # Every change lands via a PR, and the pull_request run is the merge gate — so we
  # deliberately do NOT re-run CI on main after a merge. That post-merge run would
  # just repeat the ~1.5h suite the PR already passed, on the slow serial runners.
  # Push only builds release tags; feature branches are covered by pull_request.
  push:
    tags: ['v*']
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same branch
# (or PR). head_ref is set for pull_request events; ref covers pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # php-cs-fixer and psalm are PHP-version-independent (they analyse source,
  # not runtime), so pin them to the highest supported PHP (8.3) — one job each.
  cs-check:
    runs-on: kanso-runners
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: php-cs-fixer
        run: composer cs:check

  psalm:
    runs-on: kanso-runners
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Psalm static analysis
        run: composer psalm

  # Unit tests DO exercise the runtime, so run them across the supported PHP
  # range (8.2 for NC 30–33, 8.3 for NC 34) to catch version-specific breakage.
  unit-php:
    runs-on: kanso-runners
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run unit tests
        run: vendor/bin/phpunit -c phpunit.xml

  build-frontend:
    runs-on: kanso-runners
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build

  # Cross-version × cross-DB install/migration matrix. This is what actually
  # VALIDATES the info.xml claim of NC 30–34: for each (version, db) combo it
  # builds the frontend, boots a throwaway Nextcloud on that DB, enables Kanso
  # (running every migration via the app-enable + `occ upgrade`), then asserts
  # the schema was really created (dev/smoke.sh). It deliberately does NOT run
  # Playwright — the full browser e2e is slow and stays on 34+postgres only (the
  # `e2e` job below). PHPUnit is covered separately by the `unit-php` job (across
  # PHP 8.2 and 8.3); it is NOT re-run inside these containers because the ARC
  # runner's dind network can't reach the internet from inside a container, so a
  # container can't fetch composer to install the (gitignored) dev deps.
  #
  # DB coverage rationale:
  #   - sqlite: no service container, cheap, and it's the backend that surfaced
  #     the default-index-name migration bug — so it runs on every NC version.
  #   - postgres: the production/dev default — runs on every NC version.
  #   - mysql (mariadb): added on NC 34 only (the newest target) to catch
  #     MySQL-dialect issues without a 5x combo blow-up. See PR notes / the TODO
  #     to widen mysql across versions if a dialect issue ever surfaces.
  install-matrix:
    runs-on: kanso-runners
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nc-version: ['30', '31', '32', '33', '34']
        db: ['sqlite', 'postgres']
        include:
          - nc-version: '34'
            db: 'mysql'
    name: install (NC ${{ matrix.nc-version }} · ${{ matrix.db }})
    env:
      NC_VERSION: ${{ matrix.nc-version }}
      KANSO_DB: ${{ matrix.db }}
      # No realtime push needed for install/migration validation; skipping keeps
      # the boot from depending on an appstore fetch of notify_push.
      KANSO_SKIP_NOTIFY_PUSH: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # js/ + css/ are gitignored and mounted from the checkout, so build before
      # the stack boots (same reason as the e2e job).
      - name: Build frontend
        run: npm run build

      - name: Ensure docker compose plugin
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p ~/.docker/cli-plugins
            curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 \
              -o ~/.docker/cli-plugins/docker-compose
            chmod +x ~/.docker/cli-plugins/docker-compose
          fi
          docker compose version

      # Boot NC <version> on <db>, enable Kanso (runs the migrations).
      - name: Boot Nextcloud ${{ matrix.nc-version }} on ${{ matrix.db }}
        run: ./dev/setup.sh

      # Re-run migrations idempotently and apply any repair steps. `occ upgrade`
      # is a no-op on an already-current app but exercises the migrator path;
      # `-v` surfaces any per-migration warning.
      - name: occ upgrade (run migrations)
        run: |
          docker exec -u www-data kanso-dev php occ upgrade -v || true
          docker exec -u www-data kanso-dev php occ maintenance:mode --off || true

      # Load-bearing assertion: the schema physically exists on this DB. This is
      # the check that would have caught the "zero tables created" migration bug.
      - name: Smoke — schema present
        run: ./dev/smoke.sh

      - name: Dump Nextcloud logs on failure
        if: ${{ failure() }}
        run: |
          docker logs kanso-dev --tail 200 || true
          docker exec kanso-dev tail -n 120 /var/www/html/data/nextcloud.log || true

  e2e:
    runs-on: kanso-runners
    # Boots a full Nextcloud + runs ~170 serial tests (workers:1, retries:1).
    # The self-hosted runner is ~4-5x slower than a dev box (~28s/test observed),
    # so the serial suite needs ~85 min of test time + ~8 min setup. Cap at 120
    # to leave comfortable margin (still bounds a hung stack under the 6h default).
    # If this ever needs to be faster, shard the specs across parallel jobs
    # rather than raising per-Nextcloud worker count (specs share one instance).
    timeout-minutes: 120
    env:
      # Realtime push isn't needed for the UI specs (they poll); skip it so a
      # flaky appstore release can't fail the boot.
      KANSO_SKIP_NOTIFY_PUSH: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The app is mounted into the container from the checkout, and js/ + css/
      # are gitignored — so the frontend must be built before the stack boots.
      - name: Build frontend
        run: npm run build

      # The self-hosted ARC runner image ships the docker CLI but not the
      # Compose v2 plugin (ubuntu-latest has it preinstalled). setup.sh uses
      # `docker compose`, so install the plugin if it's missing.
      - name: Ensure docker compose plugin
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p ~/.docker/cli-plugins
            curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 \
              -o ~/.docker/cli-plugins/docker-compose
            chmod +x ~/.docker/cli-plugins/docker-compose
          fi
          docker compose version

      # Boot the same throwaway Nextcloud stack used locally (dev/setup.sh):
      # postgres + redis + notify_push + nextcloud:34-apache, app enabled,
      # firstrunwizard disabled, tester user + push wired up. Idempotent.
      - name: Boot dev Nextcloud stack
        run: ./dev/setup.sh

      # deck-import.spec.js drives the real Deck API to seed a source board, so
      # Deck must be installed. The cluster's dind network can't reach the NC
      # appstore, so side-load the signed release tarball (runner has internet):
      # download here, copy into the container, enable. Pinned to the version
      # the dev stack uses.
      - name: Install Deck (for the import spec)
        run: |
          curl -fsSL https://github.com/nextcloud-releases/deck/releases/download/v1.18.3/deck-v1.18.3.tar.gz -o /tmp/deck.tar.gz
          docker cp /tmp/deck.tar.gz kanso-dev:/tmp/deck.tar.gz
          docker exec kanso-dev bash -c 'tar -xzf /tmp/deck.tar.gz -C /var/www/html/custom_apps && chown -R www-data:www-data /var/www/html/custom_apps/deck'
          docker exec -u www-data kanso-dev php occ app:enable deck

      # card-contacts.spec.js exercises the feature-detected contact picker,
      # which needs the Contacts app installed. Same appstore-unreachable
      # constraint as Deck above, so side-load the signed release tarball.
      # Pinned to v8.7.5 (info.xml min-version=33 max-version=34 — NC34-compatible).
      - name: Install Contacts (for the card-contacts spec)
        run: |
          curl -fsSL https://github.com/nextcloud-releases/contacts/releases/download/v8.7.5/contacts-v8.7.5.tar.gz -o /tmp/contacts.tar.gz
          docker cp /tmp/contacts.tar.gz kanso-dev:/tmp/contacts.tar.gz
          docker exec kanso-dev bash -c 'tar -xzf /tmp/contacts.tar.gz -C /var/www/html/custom_apps && chown -R www-data:www-data /var/www/html/custom_apps/contacts'
          docker exec -u www-data kanso-dev php occ app:enable contacts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Surface container logs when the stack or a spec fails so failures are
      # diagnosable without re-running locally.
      - name: Dump Nextcloud logs on failure
        if: ${{ failure() }}
        run: |
          docker logs kanso-dev --tail 200 || true
          docker exec kanso-dev tail -n 100 /var/www/html/data/nextcloud.log || true
