name: Release

# Tag a release: git tag v0.9.0 && git push origin v0.9.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The `secrets` context is NOT allowed in a step-level `if:`, so surface
    # "do we have a signing key?" as a job-level env var (which IS allowed).
    env:
      HAVE_SIGNING_KEY: ${{ secrets.APP_PRIVATE_KEY != '' && 'yes' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # Nextcloud occ is only needed to embed appinfo/signature.json. We fetch a
      # matching server checkout so `occ integrity:sign-app` is available in CI.
      # Signing is gated on the APP_PRIVATE_KEY secret being present; without it
      # the build still produces a valid (unsigned) tarball.
      - name: Provide occ for signing
        id: occ
        if: env.HAVE_SIGNING_KEY == 'yes'
        run: |
          git clone --depth=1 --branch=v34.0.2 https://github.com/nextcloud/server.git "$RUNNER_TEMP/server"
          # occ needs the composer autoloader, which nextcloud/server vendors in the
          # `3rdparty` submodule (absent from a bare clone). Without it, occ aborts
          # with "Composer autoloader not found" and integrity:sign-app never writes
          # appinfo/signature.json.
          git -C "$RUNNER_TEMP/server" submodule update --init --depth=1 3rdparty
          echo "path=$RUNNER_TEMP/server/occ" >> "$GITHUB_OUTPUT"

      - name: Build release tarball
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_CERTIFICATE: ${{ secrets.APP_CERTIFICATE }}
          OCC: ${{ steps.occ.outputs.path }}
        run: bash scripts/build-release.sh

      # Build user-facing release notes from the matching CHANGELOG section
      # (Keep a Changelog) so the release description is the actual "what
      # changed", not maintainer packaging notes. GitHub then appends its own
      # auto-generated "What's Changed" / contributors / full-changelog block.
      - name: Assemble release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          section="$(awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") {f=1; next}
            /^## \[/ {f=0}
            f {print}
          ' CHANGELOG.md)"
          {
            if [ -n "$section" ]; then
              printf '%s\n' "$section"
            else
              echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
            fi
            echo
            echo '## Install'
            echo
            echo 'Extract `kanso.tar.gz` into your Nextcloud `custom_apps/` (or `apps/`) directory and enable it:'
            echo
            echo '```sh'
            echo 'tar -xzf kanso.tar.gz -C /path/to/nextcloud/custom_apps'
            echo 'sudo -u www-data php /path/to/nextcloud/occ app:enable kanso'
            echo '```'
            echo
            echo 'Requires Nextcloud 30–34 on PHP 8.2–8.3.'
          } > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Attach tarball to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/kanso.tar.gz
            build/kanso.tar.gz.sig.base64
          fail_on_unmatched_files: false
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
