name: Release

# semantic-release owns the whole release: it reads the Conventional-Commit
# history since the last tag, computes the next version, updates the changelog,
# builds + signs the tarball, publishes the GitHub release, uploads to the
# Nextcloud App Store, and commits the version bump back to main.
#
# Trigger: manual button (a human gate on public-store releases). Run it from
# Actions → Release → "Run workflow" whenever you want to cut a release.
#
# To go fully continuous instead (a release on every push to main that contains
# a fix:/feat: commit), add:
#   push:
#     branches: [main]
# The release commit is tagged `[skip ci]`, so it never re-triggers CI.
on:
  workflow_dispatch:

permissions:
  contents: write        # create the tag/release and push the release commit
  issues: write          # semantic-release comments on released issues
  pull-requests: write   # …and on released PRs

jobs:
  release:
    runs-on: ubuntu-latest
    # The `secrets` context is NOT allowed in a step-level `if:`, so surface
    # "do we have a signing key?" as a job-level env var (which IS allowed).
    env:
      HAVE_SIGNING_KEY: ${{ secrets.APP_PRIVATE_KEY != '' && 'yes' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release needs the full history + all tags to find the last
          # release and analyse commits since. RELEASE_TOKEN (a PAT/App token
          # allowed to push to protected main) is preferred; without it the push
          # of the version-bump commit to main will be rejected by branch
          # protection. Falls back to GITHUB_TOKEN for dry runs / forks.
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # occ is only needed to embed appinfo/signature.json. Fetch a matching
      # server checkout so `occ integrity:sign-app` is available; gated on the
      # signing key being present. The 3rdparty submodule provides occ's
      # composer autoloader (a bare clone lacks it and occ aborts).
      - name: Provide occ for signing
        id: occ
        if: env.HAVE_SIGNING_KEY == 'yes'
        run: |
          git clone --depth=1 --branch=v34.0.2 https://github.com/nextcloud/server.git "$RUNNER_TEMP/server"
          git -C "$RUNNER_TEMP/server" submodule update --init --depth=1 3rdparty
          echo "path=$RUNNER_TEMP/server/occ" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Build js/ once here; build-release.sh then reuses it (SKIP_BUILD=1)
      # instead of running a second npm ci + vite build inside prepare.
      - name: Build frontend
        run: npm run build

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_CERTIFICATE: ${{ secrets.APP_CERTIFICATE }}
          OCC: ${{ steps.occ.outputs.path }}
          NC_APPSTORE_TOKEN: ${{ secrets.NC_APPSTORE_TOKEN }}
          SKIP_BUILD: '1'
        run: npx semantic-release
